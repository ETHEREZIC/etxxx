<script>
(function() {
    // ----------------------------- DATA INJECTION FROM JEKYLL ------------------------------
    const worksData = [
        {% for work in site.works %}
        { title: "{{ work.title }}", year: "{{ work.year }}", desc: "{{ work.desc }}", imgIcon: "{{ work.imgIcon }}" },
        {% endfor %}
    ];
    
    const appsData = [
        {% for app in site.data.portfolio.apps %}
        { title: "{{ app.title }}", tag: "{{ app.tag }}", desc: "{{ app.desc }}" },
        {% endfor %}
    ];
    
    // Theme handling
    function setTheme(theme) {
    if (theme === 'dark') {
        document.body.classList.add('dark');
    } else {
        document.body.classList.remove('dark');
    }
    localStorage.setItem('etherazic_theme', theme);
    }

    function toggleTheme() {
        const isDark = document.body.classList.contains('dark');
        setTheme(isDark ? 'light' : 'dark');
    }

    const savedTheme = localStorage.getItem('etherazic_theme');
    if (savedTheme === 'dark') setTheme('dark');

    const themeToggleBtn = document.getElementById('themeToggle');
    if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', toggleTheme);
    }
    
    // Sidebar state
    let sidebarCollapsed = false;
    let isMobile = window.innerWidth < 768;
    let mobileMenuOpen = false;
    
    const sidebarEl = document.getElementById('sidebar');
    const foldBtn = document.getElementById('foldSidebarBtn');
    const floatBtn = document.getElementById('floatExpandBtn');
    const mainContent = document.getElementById('mainContent');
    
    function updateSidebarUI() {
        if (isMobile) {
            if (mobileMenuOpen) {
                sidebarEl.classList.add('mobile-open');
                document.body.classList.remove('sidebar-collapsed');
            } else {
                sidebarEl.classList.remove('mobile-open');
                document.body.classList.add('sidebar-collapsed');
            }
            floatBtn?.classList.toggle('hidden', mobileMenuOpen);
        } else {
            if (sidebarCollapsed) {
                document.body.classList.add('sidebar-collapsed');
            } else {
                document.body.classList.remove('sidebar-collapsed');
            }
            floatBtn?.classList.toggle('hidden', !sidebarCollapsed);
        }
    }
    
    function expandSidebar() {
        if (isMobile) {
            mobileMenuOpen = true;
            updateSidebarUI();
        } else {
            sidebarCollapsed = false;
            updateSidebarUI();
        }
    }
    
    function collapseSidebar() {
        if (isMobile) {
            mobileMenuOpen = false;
            updateSidebarUI();
        } else {
            sidebarCollapsed = true;
            updateSidebarUI();
        }
    }
    
    foldBtn?.addEventListener('click', collapseSidebar);
    floatBtn?.addEventListener('click', expandSidebar);
    
    window.addEventListener('resize', () => {
        const newMobile = window.innerWidth < 768;
        if (newMobile !== isMobile) {
            isMobile = newMobile;
            if (isMobile) {
                mobileMenuOpen = false;
                sidebarCollapsed = false;
            }
            updateSidebarUI();
        }
    });
    
    isMobile = window.innerWidth < 768;
    updateSidebarUI();
    
    // ----------------------------- RENDER FUNCTIONS ------------------------------
    const contentView = document.getElementById('mainContent');
    
    function renderAbout() {
        contentView.innerHTML = `
            <div class="content-section">
                <div class="glass-card" style="margin-bottom:32px;">
                    <span class="fact-badge">Архитектор / Основатель</span>
                    <h2>Даниил Вознесенский<br> <span style="font-size:1.2rem;">ETHEREZIC STUDIO</span></h2>
                    <p style="margin-top:12px;">Формирую среду, где технология встречается с поэтикой. Работа на стыке параметрического дизайна, устойчивых материалов и цифрового производства.</p>
                </div>
                <div class="hero-grid">
                    <div class="glass-card"><i class="fas fa-drafting-compass" style="font-size:2rem;"></i><h3>12+ лет</h3><p>Международный опыт, проекты в Европе, Азии и ОАЭ</p></div>
                    <div class="glass-card"><i class="fas fa-building"></i><h3>34 объекта</h3><p>От частных интерьеров до градостроительных концепций</p></div>
                    <div class="glass-card"><i class="fas fa-trophy"></i><h3>8 наград</h3><p>ArchDaily, Dezeen Awards, Golden Trezzini</p></div>
                </div>
                <div class="glass-card" style="margin-top:24px;">
                    <h3>Манифест студии</h3>
                    <p>«Архитектура — это не просто здания, это цифровые ландшафты, воздушные объёмы и световая драматургия. Каждый проект — исследование».</p>
                    <hr>
                    <div style="display:flex; gap:12px; flex-wrap:wrap;"><span class="fact-badge">#киберпанк-эстетика</span><span class="fact-badge">#бионика</span><span class="fact-badge">#умные фасады</span></div>
                </div>
            </div>
        `;
    }
    
    function renderWorksOverview() {
        contentView.innerHTML = `<div class="content-section"><h2>Избранные проекты</h2><div class="project-grid">${worksData.map(p => `<div class="project-item"><div class="project-img">${p.imgIcon || '🏛️'}</div><div class="project-info"><h3>${p.title}</h3><p>${p.desc || p.year}</p></div></div>`).join('')}</div></div>`;
    }
    
    function renderWorkDetail(work) {
        contentView.innerHTML = `<div class="content-section"><div class="glass-card"><h2>${work.title}</h2><p>${work.desc}</p><span class="fact-badge">${work.year}</span><hr><p>Полное описание: параметрическая структура, инновационные фасадные системы и световой дизайн.</p></div></div>`;
    }
    
    function renderAppsOverview() {
        contentView.innerHTML = `<div class="content-section"><h2>Цифровые инструменты</h2><div class="hero-grid">${appsData.map(a => `<div class="glass-card"><h3>${a.title}</h3><span class="fact-badge">${a.tag}</span><p style="margin-top:10px;">${a.desc}</p></div>`).join('')}</div></div>`;
    }
    
    function renderAppDetail(app) {
        contentView.innerHTML = `<div class="content-section"><div class="glass-card"><h2>${app.title}</h2><span class="fact-badge">${app.tag}</span><p style="margin-top:16px;">${app.desc} • Интеграция с Rhino, Unreal Engine, доступен демо-доступ.</p></div></div>`;
    }
    
    function renderBlogOverview() {
        const postsHtml = Array.from(document.querySelectorAll('.year-posts li')).slice(0, 5).map(li => {
            const title = li.textContent;
            return `<div class="glass-card"><h3>${title}</h3><p>Исследование новых подходов и цифровых инструментов в архитектурной практике.</p><small style="color:var(--text-muted)">2026</small></div>`;
        }).join('');
        contentView.innerHTML = `<div class="content-section"><h2>Блог — исследования, тренды</h2><div class="hero-grid">${postsHtml}</div><p class="fact-badge" style="margin-top:20px;">→ Выберите год в меню слева для полного архива</p></div>`;
    }
    
    function renderBlogPost(post) {
        contentView.innerHTML = `<div class="content-section"><div class="glass-card"><h2>${post.title}</h2><p style="margin:16px 0;">${post.excerpt || 'Полный текст статьи: исследование о роли светопрозрачных структур, новых композитах и цифровом проектировании.'}</p><span class="fact-badge"><i class="far fa-calendar-alt"></i> ${post.date || 'Архитектурный дневник'}</span></div></div>`;
    }
    
    // ----------------------------- MENU EVENT LISTENERS ------------------------------
    function initMenuListeners() {
        // Обо мне
        const aboutHeader = document.querySelector('.menu-header[data-section="about"]');
        if (aboutHeader) {
            aboutHeader.addEventListener('click', () => {
                renderAbout();
                if (isMobile) { mobileMenuOpen = false; updateSidebarUI(); }
            });
        }
        
        // Работы (основной заголовок)
        const worksHeader = document.querySelector('.menu-header[data-section="works"]');
        const worksSubmenu = document.querySelector('.menu-header[data-section="works"]')?.parentElement?.querySelector('.submenu');
        if (worksHeader) {
            worksHeader.addEventListener('click', (e) => {
                e.stopPropagation();
                worksSubmenu?.classList.toggle('open');
                const chevron = worksHeader.querySelector('.chevron');
                if (chevron) chevron.classList.toggle('rotated');
                renderWorksOverview();
                if (isMobile) { mobileMenuOpen = false; updateSidebarUI(); }
            });
            
            // Подменю работ
            document.querySelectorAll('.submenu li[data-work]').forEach(li => {
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const work = JSON.parse(li.dataset.work);
                    renderWorkDetail(work);
                    if (isMobile) { mobileMenuOpen = false; updateSidebarUI(); }
                });
            });
        }
        
        // Приложения
        const appsHeader = document.querySelector('.menu-header[data-section="apps"]');
        const appsSubmenu = document.querySelector('.menu-header[data-section="apps"]')?.parentElement?.querySelector('.submenu');
        if (appsHeader) {
            appsHeader.addEventListener('click', (e) => {
                e.stopPropagation();
                appsSubmenu?.classList.toggle('open');
                const chevron = appsHeader.querySelector('.chevron');
                if (chevron) chevron.classList.toggle('rotated');
                renderAppsOverview();
                if (isMobile) { mobileMenuOpen = false; updateSidebarUI(); }
            });
            
            document.querySelectorAll('.submenu li[data-app]').forEach(li => {
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const app = JSON.parse(li.dataset.app);
                    renderAppDetail(app);
                    if (isMobile) { mobileMenuOpen = false; updateSidebarUI(); }
                });
            });
        }
        
        // Блог
        const blogHeader = document.querySelector('.menu-header[data-section="blog"]');
        const blogSubmenu = document.querySelector('.menu-header[data-section="blog"]')?.parentElement?.querySelector('.submenu');
        if (blogHeader) {
            blogHeader.addEventListener('click', (e) => {
                e.stopPropagation();
                blogSubmenu?.classList.toggle('open');
                const chevron = blogHeader.querySelector('.chevron');
                if (chevron) chevron.classList.toggle('rotated');
                renderBlogOverview();
                if (isMobile) { mobileMenuOpen = false; updateSidebarUI(); }
            });
            
            // Годовые заголовки
            document.querySelectorAll('.year-header').forEach(header => {
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const postsList = header.parentElement?.querySelector('.year-posts');
                    postsList?.classList.toggle('open');
                    const chevron = header.querySelector('.chevron');
                    if (chevron) chevron.classList.toggle('rotated');
                });
            });
            
            // Посты
            document.querySelectorAll('.year-posts li[data-post]').forEach(li => {
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const post = JSON.parse(li.dataset.post);
                    renderBlogPost(post);
                    if (isMobile) { mobileMenuOpen = false; updateSidebarUI(); }
                });
            });
        }
    }
    
    // Поиск
    document.getElementById('globalSearchBtn')?.addEventListener('click', () => {
        alert('🔍 Поиск по портфолио и блогу (демо-режим).');
    });
    
    // Инициализация после загрузки DOM
    document.addEventListener('DOMContentLoaded', () => {
        initMenuListeners();
        renderAbout(); // Показываем "Обо мне" по умолчанию
    });
})();
</script>
